config setup
    charondebug="ike 2, esp 2"

conn aes128gcm16-dh14-tunnel-pfs-off
    left=10.10.0.10
    right=10.10.0.20
    authby=secret
    ike=aes128gcm16-sha256-modp2048!
    esp=aes128gcm16!
    type=tunnel
    keyingtries=1
    ikelifetime=1h
    # Short child-SA lifetime so a rekey (CREATE_CHILD_SA) happens inside a 30 s capture.
    # With PFS on, that rekey performs a fresh Diffie-Hellman exchange.
    keylife=25s
    rekeymargin=5s
    rekeyfuzz=0%
    auto=start
