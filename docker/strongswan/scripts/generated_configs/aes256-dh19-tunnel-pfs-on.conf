config setup
    charondebug="ike 2, esp 2"

conn aes256-dh19-tunnel-pfs-on
    left=10.10.0.10
    right=10.10.0.20
    authby=secret
    ike=aes256-sha256-ecp256!
    esp=aes256-sha256-ecp256!
    type=tunnel
    keyingtries=1
    ikelifetime=1h
    # Short child-SA lifetime so a rekey (CREATE_CHILD_SA) happens inside a 30 s capture.
    # With PFS on, that rekey performs a fresh Diffie-Hellman exchange.
    keylife=25s
    rekeymargin=5s
    rekeyfuzz=0%
    auto=start
